# Builds Superset++ from fork/main using the txcript version pinned in scripts/fork/txcript-version.json.
# Upstream sync and txcript dispatches trigger validation; changing the pin is explicit.
# Bundle id, login scheme, data paths and update asset names stay compatible with existing forks.

name: Fork - build release

on:
  push:
    branches: ["fork/main"]
  workflow_run:
    workflows: ["Fork - sync with upstream"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Build even if fork/main's commit already has a release
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'NicolaPanero/superset'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      version: ${{ steps.find.outputs.version }}
      tag: ${{ steps.find.outputs.tag }}
      txcript_tag: ${{ steps.find.outputs.txcript_tag }}
      build: ${{ steps.find.outputs.build }}
    steps:
      - name: Find the commit to build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/fork/main" --jq .sha)
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/apps/desktop/package.json?ref=$sha" --jq .content |
            base64 -d | jq -r .version)
          txcript_tag=$(gh api "repos/$GITHUB_REPOSITORY/contents/scripts/fork/txcript-version.json?ref=$sha" --jq .content | base64 -d | jq -r .tag)
          tag="desktop-v${version}-fork.${sha:0:7}-tx${txcript_tag##*-fork.}"
          build=true
          if [ "$FORCE" != "true" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false
          fi
          echo "fork/main at $sha (Superset $version), txcript $txcript_tag: tag $tag, build=$build"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "txcript_tag=$txcript_tag"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      SUPERSET_AUTO_UPDATE: disabled
      SUPERSET_FORK_RELEASE: ${{ needs.check.outputs.tag }}
      SUPERSET_FORK_REPOSITORY: ${{ github.repository }}
      SUPERSET_WORKSPACE_NAME: fork
      DESKTOP_NOTIFICATIONS_PORT: "51742"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: |
          bun install --frozen --ignore-scripts
          bun run --filter=@superset/i18n build
          cd apps/desktop && bun run install:deps

      - name: Validate fork before packaging
        run: |
          bun run lint
          bun run check:i18n
          bun run --cwd packages/host-service typecheck
          bun run --cwd apps/desktop typecheck
          bun test packages/host-service/src/session-transfer packages/host-service/src/chat-v3/forkMoveClaudeSession.test.ts packages/host-service/src/chat-v3/forkLaunchChoices.test.ts packages/host-service/src/chat-v3/backgroundChats.test.ts packages/host-service/src/chat-v3/cursorSessionBridge/cursorSessionBridge.test.ts packages/host-service/src/trpc/router/agents/account-selection.test.ts packages/chat-runtime/src/harness/acp/cursorExtensions.test.ts
          bun test 'apps/desktop/src/renderer/routes/_authenticated/_dashboard/v2-workspace/$workspaceId/hooks/usePaneRegistry/components/ForkChatExtras/utils'
          bun test packages/shared/src/fork-account-usage.test.ts packages/host-service/src/trpc/router/usage/fork-quota-fetch.test.ts packages/host-service/src/trpc/router/usage/fork-quota-cache.test.ts packages/host-service/src/trpc/router/usage/fork-account-probe.test.ts packages/host-service/src/trpc/router/workspace-cleanup/fork-branch-ownership.test.ts
          bun test --preload ./packages/host-service/test/setup-env.ts packages/host-service/test/integration/fork-account-branch.integration.test.ts
          bun test --preload ./packages/host-service/test/setup-env.ts packages/host-service/src/trpc/router/agents/agents.test.ts packages/host-service/src/trpc/router/workspace-creation/utils/workspace-naming-job.test.ts

      - name: Install the txcript transfer helper
        env:
          GH_TOKEN: ${{ github.token }}
          TXCRIPT_TAG: ${{ needs.check.outputs.txcript_tag }}
        run: SUPERSET_HOME_DIR="$RUNNER_TEMP/helper" bun scripts/build-txcript-transfer.ts

      - name: Build the app
        working-directory: apps/desktop
        run: |
          : > "$RUNNER_TEMP/empty.env"
          export SUPERSET_ENV_FILE="$RUNNER_TEMP/empty.env"
          bun run prebuild
          # Shipped next to the bundled CLI; the host-service looks there first.
          install -m 755 "$RUNNER_TEMP/helper/bin/txcript-transfer" dist/resources/bin/txcript-transfer
          install -m 755 "$RUNNER_TEMP/helper/bin/txcript-cli" dist/resources/bin/txcript-cli
          bunx electron-builder --config electron-builder.ts --publish never --mac zip --arm64
          zip=$(ls release/*-arm64-mac.zip | head -n 1)
          mv "$zip" "$RUNNER_TEMP/Superset-fork-arm64.zip"
          ls -lh "$RUNNER_TEMP/Superset-fork-arm64.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Superset ${VERSION} with this fork's changes, from \`fork/main\` at ${SHA}.

          Install or update on an Apple Silicon Mac (settings and data are kept):

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/fork/main/scripts/fork/install.sh | sh
          \`\`\`

          The app isn't notarized. Installed with the command above it opens
          normally; downloaded with a browser, open it once from System
          Settings → Privacy & Security → "Open Anyway".
          EOF
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "$RUNNER_TEMP/Superset-fork-arm64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Superset++ ${VERSION} (${SHA:0:7})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
