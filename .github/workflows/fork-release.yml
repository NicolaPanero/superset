# Builds Paradev++ from fork/main using the txcript version pinned in scripts/fork/txcript-version.json.
# Pushes reuse successful PR validation for identical content; changing the txcript pin is explicit.
# Bundle id, login scheme, data paths and update asset names stay compatible with existing forks.

name: Fork - build release

on:
  push:
    branches: ["fork/main"]
  workflow_dispatch:
    inputs:
      force:
        description: Build even if fork/main's commit already has a release
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'NicolaPanero/superset'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      version: ${{ steps.find.outputs.version }}
      tag: ${{ steps.find.outputs.tag }}
      txcript_tag: ${{ steps.find.outputs.txcript_tag }}
      build: ${{ steps.find.outputs.build }}
    steps:
      - name: Wait for a stable push before starting expensive jobs
        if: github.event_name == 'push'
        run: sleep 60
      - name: Find the commit to build
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
          EVENT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/fork/main" --jq .sha)
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/apps/desktop/package.json?ref=$sha" --jq .content |
            base64 -d | jq -r .version)
          txcript_tag=$(gh api "repos/$GITHUB_REPOSITORY/contents/scripts/fork/txcript-version.json?ref=$sha" --jq .content | base64 -d | jq -r .tag)
          tag="desktop-v${version}-fork.${sha:0:7}-tx${txcript_tag##*-fork.}"
          build=true
          if [ -n "$EVENT_SHA" ] && [ "$EVENT_SHA" != "$sha" ]; then
            echo "Superseded push: $EVENT_SHA; fork/main is now $sha"
            build=false
          fi
          if [ "$FORCE" != "true" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets --jq '.isDraft == false and ([.assets[].name] | contains(["Superset-fork-arm64.zip"]))' 2>/dev/null | grep -qx true; then
            build=false
          fi
          echo "fork/main at $sha (Superset $version), txcript $txcript_tag: tag $tag, build=$build"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "txcript_tag=$txcript_tag"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  validate:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Reuse checks already passed for this exact commit
        id: validation-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fork-validation
          key: fork-validated-ubuntu24-v1-${{ needs.check.outputs.sha }}
      - name: Reuse successful PR validation for identical content
        id: pr-validation
        if: steps.validation-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fork/reuse-pr-validation.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.validation-cache.outputs.cache-hit != 'true' && steps.pr-validation.outputs.validated != 'true'
        with:
          bun-version-file: .bun-version
      - name: Cache downloaded dependencies
        if: steps.validation-cache.outputs.cache-hit != 'true' && steps.pr-validation.outputs.validated != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun install --frozen --ignore-scripts
        if: steps.validation-cache.outputs.cache-hit != 'true' && steps.pr-validation.outputs.validated != 'true'
      - name: Validate fork before platform builds
        if: steps.validation-cache.outputs.cache-hit != 'true' && steps.pr-validation.outputs.validated != 'true'
        run: |
          bash scripts/fork/validate.sh
      - name: Cache successful validation for this commit
        if: steps.validation-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/fork-validation"
          echo '${{ needs.check.outputs.sha }}' > "$RUNNER_TEMP/fork-validation/passed"

  build:
    needs: [check, validate]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15
            platform: mac
            suffix: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SUPERSET_AUTO_UPDATE: disabled
      SUPERSET_FORK_RELEASE: ${{ needs.check.outputs.tag }}
      SUPERSET_FORK_REPOSITORY: ${{ github.repository }}
      SUPERSET_WORKSPACE_NAME: fork
      DESKTOP_NOTIFICATIONS_PORT: "51742"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Reuse an already verified package for this platform and commit
        id: package-cache
        if: inputs.force != true
        uses: actions/cache@v4
        with:
          path: apps/desktop/release/Superset-fork-*
          key: fork-package-v1-${{ matrix.platform }}-${{ needs.check.outputs.sha }}-${{ needs.check.outputs.txcript_tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: steps.package-cache.outputs.cache-hit != 'true'
        with:
          bun-version-file: .bun-version
      - name: Cache downloaded dependencies
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install dependencies
        if: steps.package-cache.outputs.cache-hit != 'true'
        run: |
          bun install --frozen --ignore-scripts
          bun run --filter=@superset/i18n build
      - name: Cache the pinned native transfer tools
        if: steps.package-cache.outputs.cache-hit != 'true'
        id: helper-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/helper/bin
          key: ${{ runner.os }}-${{ runner.arch }}-txcript-${{ needs.check.outputs.txcript_tag }}
      - name: Install the pinned native transfer tools
        if: steps.helper-cache.outputs.cache-hit != 'true' && steps.package-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TXCRIPT_TAG: ${{ needs.check.outputs.txcript_tag }}
        run: |
          gh release view "$TXCRIPT_TAG" --repo NicolaPanero/txcript >/dev/null || { echo "Pinned helper release unavailable; refusing an unverified version"; exit 1; }
          SUPERSET_HOME_DIR="$RUNNER_TEMP/helper" bun scripts/build-txcript-transfer.ts
      - name: Verify all native conversion directions
        if: steps.package-cache.outputs.cache-hit != 'true'
        run: bun run test:fork:native "$RUNNER_TEMP/helper/bin/txcript-transfer${{ matrix.suffix }}"
      - name: Rebuild Electron dependencies
        if: steps.package-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: bun run install:deps
      - name: Compile app and bundle transfer tools
        if: steps.package-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: |
          : > "$RUNNER_TEMP/empty.env"
          export SUPERSET_ENV_FILE="$RUNNER_TEMP/empty.env"
          bun run prebuild
          cp "$RUNNER_TEMP/helper/bin/txcript-transfer${{ matrix.suffix }}" "dist/resources/bin/txcript-transfer${{ matrix.suffix }}"
          cp "$RUNNER_TEMP/helper/bin/txcript-cli${{ matrix.suffix }}" "dist/resources/bin/txcript-cli${{ matrix.suffix }}"
      - name: Package macOS
        if: runner.os == 'macOS' && steps.package-cache.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        run: |
          bunx electron-builder --config electron-builder.ts --publish never --mac zip --arm64
          zip=$(ls release/*-arm64-mac.zip | head -n 1)
          mv "$zip" release/Superset-fork-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fork-package-${{ matrix.platform }}
          path: |
            apps/desktop/release/Superset-fork-arm64.zip
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fork-package-*
          merge-multiple: true
      - name: Publish the verified build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/fork/main" --jq .sha)
          if [ "$current_sha" != "$SHA" ]; then
            echo "Skipping outdated release: built $SHA, fork/main is now $current_sha"
            exit 0
          fi
          test -s Superset-fork-arm64.zip
          cat > notes.md <<EOF
          Paradev++ ${VERSION}, from fork/main at ${SHA}.

          - Mac Apple Silicon: Superset-fork-arm64.zip

          This is a bridge build: its installer also accepts Paradev++.app, the name used by a later release.

          This build uses this fork's automatic update notifications. Settings, conversations and profiles are kept during updates. Paradev++ can coexist with the official app.

          Windows is not supported yet. The Mac build is not notarized.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            test "$draft" = true || { echo "Published release preserved"; exit 0; }
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Paradev++ ${VERSION} (${SHA:0:7})" --notes-file notes.md --draft
          fi
          gh release upload "$TAG" Superset-fork-arm64.zip --repo "$GITHUB_REPOSITORY" --clobber
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/fork/main" --jq .sha)
          if [ "$current_sha" != "$SHA" ]; then
            echo "Keeping outdated build as a draft: fork/main advanced during upload"
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
