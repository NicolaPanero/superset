name: Debug git-watcher OOM (temporary)

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/debug-git-watcher-oom.yml"
      - "packages/host-service/**"

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen --ignore-scripts

      - name: Run the full test suite like CI, with memory and kernel logs
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          REALTIME_URL: ${{ secrets.REALTIME_URL }}
        run: |
          set +e
          sudo dmesg -w > /tmp/dmesg.log 2>&1 &
          (while true; do
            echo "=== $(date +%T) avail=$(free -m | awk '/Mem:/{print $7}')MB"
            ps -eo rss,pid,ppid,pgid,etimes,args --sort=-rss | head -8 | cut -c1-200
            sleep 1
          done) > /tmp/mem.log 2>&1 &
          for i in 1 2 3; do
            echo "##### run $i"
            timeout 900 bun turbo test --concurrency=2 --force --output-logs=errors-only
            echo "##### run $i exit=$?"
          done
          echo "##### lowest available memory"
          grep -o "avail=[0-9]*" /tmp/mem.log | sort -t= -k2 -n | head -3
          echo "##### samples around the lowest point"
          low=$(grep -n "avail=" /tmp/mem.log | sort -t= -k2 -n | head -1 | cut -d: -f1)
          sed -n "$((low-20)),$((low+10))p" /tmp/mem.log
          echo "##### kernel log"
          grep -iE "oom|killed process|out of memory" /tmp/dmesg.log | tail -20
