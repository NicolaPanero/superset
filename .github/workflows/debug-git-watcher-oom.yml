name: Debug host-service OOM (temporary)

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/debug-git-watcher-oom.yml"

jobs:
  repro:
    name: repro bun ${{ matrix.bun }} #${{ matrix.n }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.3.14", "1.4.2"]
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - run: bun install --frozen --ignore-scripts

      - run: bun run --filter=@superset/i18n build

      - name: host-service tests in one process, sampling memory
        working-directory: packages/host-service
        run: |
          set +e
          (while true; do
            echo "$(date +%T) bun_rss_mb=$(ps -C bun -o rss= | awk '{s+=$1} END {print int(s/1024)}') avail_mb=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo) git_procs=$(pgrep -c git)"
            sleep 1
          done) > /tmp/mem.log &
          bun test --pass-with-no-tests > /tmp/test.log 2>&1
          echo "exit=$?"
          echo "##### files in the order they started, last 6"
          grep -E "^\S+\.test\.ts:$" /tmp/test.log | tail -6
          tail -4 /tmp/test.log
          echo "##### peak"
          sort -t= -k2 -n /tmp/mem.log | awk -F'bun_rss_mb=' '{print $2}' | sort -n | tail -1
          echo "##### every 10th sample"
          awk 'NR % 10 == 0' /tmp/mem.log
          echo "##### last 30 samples"
          tail -30 /tmp/mem.log
          sudo dmesg | grep -iE "oom|killed process" | tail -5
