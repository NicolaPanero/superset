# Keeps this fork in step with superset-sh/superset, daily:
#
# - fast-forwards main, an exact mirror of upstream main;
# - merges upstream's newest desktop release (desktop-v* tag) into fork/main,
#   which carries this fork's changes, then runs lint, check:i18n and the
#   typecheck of the workspaces the fork changes before pushing.
#
# A failed run makes GitHub email the account that owns this workflow:
# merge conflicts or failed checks push nothing and need a hand merge with
# scripts/fork/sync-upstream.sh. The release workflow builds what this pushes.
#
# GitHub's built-in token may not change files under .github/workflows, which
# upstream edits often; a FORK_SYNC_TOKEN secret (fine-grained token with
# Contents and Workflows write access to this repository) lifts that limit.

name: Fork - sync with upstream

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'NicolaPanero/superset'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Mirror upstream main
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" \
            -f branch=main --jq '"\(.merge_type): \(.message)"'

      - name: Check out fork/main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (Node 24)
        with:
          ref: fork/main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install gettext
        run: sudo apt-get install -y --no-install-recommends gettext

      - name: Merge the newest upstream release
        run: |
          git config user.name "Nicola Panero"
          git config user.email "panero.nicola01.np@gmail.com"
          set +e
          bash scripts/fork/sync-upstream.sh --checks --push 2>&1 | tee sync.log
          status=${PIPESTATUS[0]}
          set -e
          case "$status" in
            0) ;;
            2) echo "::error title=Upstream release conflicts with fork/main::Nothing was pushed. Merge it by hand with scripts/fork/sync-upstream.sh." ;;
            3) echo "::error title=Checks failed after the upstream merge::Nothing was pushed. Run scripts/fork/sync-upstream.sh --checks locally." ;;
            *) echo "::error title=Upstream sync failed::See the log of this run." ;;
          esac
          exit "$status"

      # Upstream's own workflows would run here too (and fail without its
      # secrets), including ones added later, so keep them switched off; only
      # this fork's sync and release workflows stay on.
      - name: Keep upstream workflows disabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json path,state \
            --jq '.[] | select(.state == "active") | .path
              | select(. != ".github/workflows/fork-sync-upstream.yml" and . != ".github/workflows/fork-release.yml")' |
          while read -r path; do
            gh workflow disable "$(basename "$path")" --repo "$GITHUB_REPOSITORY"
          done
