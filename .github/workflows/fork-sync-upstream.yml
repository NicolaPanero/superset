# Keeps main as an upstream mirror and proposes published stable desktop releases.
# fork/main changes only after an owner-controlled PR merge; that push starts the build.
# FORK_SYNC_TOKEN needs Contents, Workflows and Pull requests write access.

name: Fork - sync with upstream

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      retry:
        description: Propose the release again after its previous proposal was closed without merge
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'NicolaPanero/superset'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fork/main
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (Node 24)
        with:
          ref: fork/main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Mirror upstream main
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
        run: bash scripts/fork/fork-upstream-source.sh mirror

      - name: Check whether a published release needs merging
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
        run: |
          set -o pipefail
          source scripts/fork/fork-upstream-source.sh
          fork_upstream_load
          fork_upstream_resolve ""
          fork_upstream_fetch
          merge=true
          if fork_upstream_ancestor "$FORK_UPSTREAM_SHA" origin/fork/main; then merge=false; fi
          echo "Published upstream release: $FORK_UPSTREAM_REPOSITORY $FORK_UPSTREAM_TAG ($FORK_UPSTREAM_SHA); prepare=$merge"
          echo "tag=$FORK_UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "merge=$merge" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.upstream.outputs.merge == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache downloaded dependencies
        if: steps.upstream.outputs.merge == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-
      - name: Install gettext
        if: steps.upstream.outputs.merge == 'true'
        run: sudo apt-get install -y --no-install-recommends gettext

      - name: Propose the published release for owner review
        if: steps.upstream.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          FORK_SYNC_RETRY: ${{ inputs.retry || false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/fork/prepare-upstream-pr.sh "$UPSTREAM_TAG"

      # Upstream's own workflows would run here too (and fail without its
      # secrets), including ones added later, so keep them switched off; only
      # this fork's sync, regression and release workflows stay on.
      - name: Keep upstream workflows disabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json path,state \
            --jq '.[] | select(.state == "active") | .path
              | select(. != ".github/workflows/fork-sync-upstream.yml" and . != ".github/workflows/fork-release.yml" and . != ".github/workflows/fork-tests.yml")' |
          while read -r path; do
            gh workflow disable "$(basename "$path")" --repo "$GITHUB_REPOSITORY"
          done
