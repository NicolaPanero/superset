name: Fork - sync with upstream

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner != 'superset-sh'
    runs-on: ubuntu-latest
    env:
      INTEGRATION_BRANCH: fork/main
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.INTEGRATION_BRANCH }}
          fetch-depth: 0
          # Upstream commits change workflow files, which GITHUB_TOKEN may not
          # push: a token with Contents and Workflows write is required.
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install gettext
        run: sudo apt-get install -y --no-install-recommends gettext

      - name: Configure git
        run: |
          git config user.name "Nicola Panero"
          git config user.email "panero.nicola01.np@gmail.com"

      - name: Merge upstream
        id: merge
        run: |
          set +e
          bash scripts/fork/sync-upstream.sh --checks --push > sync.log 2>&1
          status=$?
          cat sync.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report a sync that needs attention
        if: steps.merge.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.merge.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$STATUS" in
            2) reason="Merge conflicts with upstream main" ;;
            3) reason="Checks failed after merging upstream main" ;;
            *) reason="Upstream sync failed" ;;
          esac
          body="$(printf '%s\n\nRun: %s\n\n```\n%s\n```\n\nResolve locally with `scripts/fork/sync-upstream.sh --checks` on `%s`.' \
            "$reason" "$RUN_URL" "$(tail -n 60 sync.log)" "$INTEGRATION_BRANCH")"
          existing="$(gh issue list --state open --label upstream-sync --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create upstream-sync --color D93F0B --force >/dev/null
            gh issue create --title "Upstream sync needs attention" --label upstream-sync --body "$body"
          fi
          exit 1
