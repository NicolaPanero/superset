name: CI (Blacksmith)

# Runs the CI jobs on Blacksmith runners next to the GitHub-hosted run, to
# compare speed and cost at two sizes. Not a required check.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  ci-4vcpu:
    name: Blacksmith 4vCPU
    uses: ./.github/workflows/ci.yml
    with:
      runner: blacksmith-4vcpu-ubuntu-2404
    secrets: inherit

  ci-8vcpu:
    name: Blacksmith 8vCPU
    uses: ./.github/workflows/ci.yml
    with:
      runner: blacksmith-8vcpu-ubuntu-2404
    secrets: inherit
