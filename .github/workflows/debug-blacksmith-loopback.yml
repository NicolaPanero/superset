name: Debug Blacksmith loopback (temporary)

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/debug-blacksmith-loopback.yml"

jobs:
  probe:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: |
          echo "--- proxy env"; env | grep -i proxy | sed -E 's#(://)[^@/]*@#\1***@#' || echo "none"
          echo "--- loopback"; ip -4 addr show lo | grep inet; cat /etc/hosts | head -5
          cat > /tmp/p.ts <<'TS'
          const s = Bun.serve({ port: 0, fetch: () => new Response("ok") });
          console.log("server", s.hostname, s.port, s.url.href);
          for (const host of ["127.0.0.1", "localhost", "[::1]"]) {
            try { const r = await fetch(`http://${host}:${s.port}/x`, { method: "POST", signal: AbortSignal.timeout(500) }); console.log(host, r.status); }
            catch (e) { console.log(host, "FAILS", (e as Error).name, (e as Error).message); }
          }
          s.stop(true);
          TS
          bun /tmp/p.ts
          echo "--- with NO_PROXY"; NO_PROXY=127.0.0.1,localhost bun /tmp/p.ts
